name: Sync health alerts

# The background tick. Every 30 minutes during the day it asks the app to sync Hosthub (so new bookings
# arrive even when nobody has the app open) and then check sync health and, if something is wrong, tell
# Stelios (email via Resend and/or Telegram). The app remembers what it already reported, so the same
# problem is sent once. 05:00-20:30 UTC covers 08:00-22:00 in Athens all year; the app skips the hours
# outside 08:00-22:00 without touching the database, so Neon's free compute is not spent at night.
# GitHub runs schedules late or drops them when it is busy, so docs/ops/monitoring.md also describes
# a free outside scheduler that can call the same address on time. Logic: apps/web/src/app/api/cron/health-alerts.
#
# Repo secrets: PRODUCTION_URL (https://...), CRON_SECRET (same value as the Vercel env var),
# optional VERCEL_AUTOMATION_BYPASS_SECRET.
on:
  schedule:
    - cron: "*/30 5-20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Call /api/cron/health-alerts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::Not set up yet: add repo secrets PRODUCTION_URL and CRON_SECRET (docs/ops/monitoring.md). Skipping."
            exit 0
          fi
          curl_opts=(--silent --show-error --max-time 300 --header "Authorization: Bearer ${CRON_SECRET}")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_opts+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          status=$(curl "${curl_opts[@]}" -o /tmp/alerts.json -w '%{http_code}' "${PRODUCTION_URL%/}/api/cron/health-alerts")
          cat /tmp/alerts.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::health-alerts endpoint answered HTTP $status"
            exit 1
          fi
