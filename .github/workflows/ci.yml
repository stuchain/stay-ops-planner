name: CI

# Runs on every push to main (work lands on main directly) and on any pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck, lint and unit tests (Turborepo)
        run: pnpm turbo run typecheck lint test
      - name: Prettier
        run: pnpm format:check

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-integration-session-secret-at-least-32-chars-long
      APP_TIMEZONE: Etc/UTC
      BOOTSTRAP_ADMIN_EMAIL: integration-admin@stayops.local
      BOOTSTRAP_ADMIN_PASSWORD: Integration_Test_Password_12+
      BOOTSTRAP_FATHER_EMAIL: integration-father@stayops.local
      BOOTSTRAP_FATHER_PASSWORD: Integration_Father_Test_12+
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build workspace packages
        run: pnpm turbo run build --filter=@stay-ops/web^...
      # The Vitest globalSetup starts a postgres:16 Testcontainer, migrates and seeds it.
      - name: Vitest integration (Testcontainers Postgres)
        run: node scripts/test-integration.mjs
