name: Daily database backup

# Daily logical backup of the production Neon database (pg_dump, custom format),
# encrypted with a passphrase and kept as a 30-day workflow artifact. The repository is public, so its
# artifacts can be downloaded by anyone signed in to GitHub: only the encrypted file is ever uploaded.
# See docs/runbooks/db-backup-restore.md for how to decrypt and restore it into a new Neon branch.
#
# pg_dump runs from the official postgres:17 docker image: Docker is preinstalled
# on ubuntu-latest, the major version is pinned to Neon's Postgres 17 (pg_dump refuses
# a server newer than itself; the runner's own client version changes with the image),
# and no apt repository or signing key has to be set up at run time.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # Same secret as "Migrate production DB": DATABASE_URL in the `production` environment.
    environment: production
    timeout-minutes: 20
    env:
      PG_IMAGE: postgres:17
    steps:
      - name: Dump database
        id: dump
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing secret DATABASE_URL in the production environment (Neon direct, non-pooled connection string)"
            exit 1
          fi
          # Never upload a readable dump: without the passphrase there is no backup, and the run goes red.
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Missing or short secret BACKUP_PASSPHRASE (20+ characters) in the production environment"
            exit 1
          fi

          stamp="$(date -u +%Y-%m-%d)"
          file="stay-ops-${stamp}.dump"
          mkdir -p backup

          # -e DATABASE_URL (no value) passes the secret through the environment,
          # so it never appears on a command line or in the log.
          docker run --rm -e DATABASE_URL "$PG_IMAGE" \
            sh -c 'pg_dump -Fc --no-owner --no-privileges "$DATABASE_URL"' \
            > "backup/${file}"

          if [ ! -s "backup/${file}" ]; then
            echo "::error::Dump file is empty"
            exit 1
          fi

          # A dump that cannot be listed cannot be restored.
          docker run --rm -i "$PG_IMAGE" pg_restore --list < "backup/${file}" > backup/toc.txt
          entries="$(grep -vc '^;' backup/toc.txt || true)"
          rm backup/toc.txt
          if [ "${entries:-0}" -lt 1 ]; then
            echo "::error::pg_restore --list found no entries in the dump"
            exit 1
          fi

          # AES-256 with the passphrase (read from a file descriptor, so it is never on a command line).
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            --output "backup/${file}.gpg" "backup/${file}" 3<<<"$BACKUP_PASSPHRASE"
          size="$(stat -c %s "backup/${file}")"
          rm "backup/${file}"
          if [ ! -s "backup/${file}.gpg" ]; then
            echo "::error::Encrypted dump is empty"
            exit 1
          fi

          echo "file=${file}.gpg" >> "$GITHUB_OUTPUT"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "Backup ${file}.gpg: ${size} bytes before encryption, ${entries} TOC entries"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: stay-ops-db-${{ steps.dump.outputs.stamp }}
          path: backup/${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error
