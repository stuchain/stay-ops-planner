name: Daily reminders

# Every morning asks the app to send the daily reminder (P4-3): arrivals and departures today,
# arrivals tomorrow and bookings without an apartment, by email (Resend) and/or Telegram. 05:00 UTC is
# 08:00 in Athens in summer and 07:00 in winter. Sent at most once a day and only when there is something
# to say; switch it off in Dev mode > System. Logic: apps/web/src/server/reminders. Setup: docs/ops/monitoring.md.
#
# Repo secrets: PRODUCTION_URL (https://...), CRON_SECRET (same value as the Vercel env var),
# optional VERCEL_AUTOMATION_BYPASS_SECRET.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Call /api/cron/daily-reminders
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::Not set up yet: add repo secrets PRODUCTION_URL and CRON_SECRET (docs/ops/monitoring.md). Skipping."
            exit 0
          fi
          curl_opts=(--silent --show-error --max-time 60 --header "Authorization: Bearer ${CRON_SECRET}")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_opts+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          status=$(curl "${curl_opts[@]}" -o /tmp/reminder.json -w '%{http_code}' "${PRODUCTION_URL%/}/api/cron/daily-reminders")
          cat /tmp/reminder.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::daily-reminders endpoint answered HTTP $status"
            exit 1
          fi
