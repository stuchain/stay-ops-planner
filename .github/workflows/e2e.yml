name: Web CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema-drift:
    name: schema-drift
    runs-on: ubuntu-latest

    services:
      # `prisma migrate diff --from-migrations` requires a shadow database to
      # replay migrations against before comparing the resulting schema to
      # `schema.prisma`. We use a dedicated short-lived Postgres for this so
      # the drift gate runs independently of the integration DB.
      shadow:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stayops
          POSTGRES_PASSWORD: stayops
          POSTGRES_DB: shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stayops -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Generate Prisma client
        run: pnpm --filter @stay-ops/db generate
      - name: Detect drift between schema.prisma and migrations/
        # Replays prisma/migrations/ on a clean shadow database, compares the
        # resulting schema to `schema.prisma`, and exits 2 if they diverge
        # (e.g. schema edited without a new migration, or migration was edited
        # after being applied elsewhere). We translate exit 2 into a clear
        # actionable error so the failure surface explains itself.
        run: |
          set +e
          pnpm --filter @stay-ops/db exec prisma migrate diff \
            --exit-code \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://stayops:stayops@localhost:5433/shadow"
          status=$?
          set -e
          if [ "$status" = "0" ]; then
            echo "Schema and migrations are in sync."
            exit 0
          fi
          if [ "$status" = "2" ]; then
            echo "::error title=Schema drift detected::schema.prisma has changes not represented in prisma/migrations/. Run 'pnpm --filter @stay-ops/db migrate:dev --name <change>' locally and commit the generated migration."
            exit 1
          fi
          echo "::error::prisma migrate diff failed with exit code $status (not a drift signal)."
          exit "$status"

  playwright:
    name: playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stayops
          POSTGRES_PASSWORD: stayops
          POSTGRES_DB: stayops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayops -d stayops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
          --health-start-period 10s


    env:
      DATABASE_URL: postgresql://stayops:stayops@localhost:5432/stayops
      SESSION_SECRET: ci-e2e-session-secret-at-least-32-chars-long
      APP_TIMEZONE: Etc/UTC
      BOOTSTRAP_ADMIN_EMAIL: e2e-admin@stayops.local
      BOOTSTRAP_ADMIN_PASSWORD: E2E_Test_Password_12+
      E2E_ADMIN_EMAIL: e2e-admin@stayops.local
      E2E_ADMIN_PASSWORD: E2E_Test_Password_12+
      # The tests run against `next start` on plain http, so the session cookie must not require https.
      SESSION_COOKIE_SECURE: "false"
      SKIP_STAYOPS_ENV_VALIDATE: "1"
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@stay-ops/web^...

      - name: Migrate database
        run: pnpm --filter @stay-ops/db exec prisma migrate deploy

      - name: Seed admin + E2E fixtures
        run: pnpm --filter @stay-ops/db seed && pnpm --filter @stay-ops/db seed:e2e

      # A production build, as on Vercel: `next dev` compiles each page on first visit, which made the suite slow
      # and its first tests prone to timeouts.
      - name: Build the app
        run: pnpm --filter @stay-ops/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @stay-ops/web exec playwright install chromium --with-deps

      - name: Start the production server
        working-directory: apps/web
        run: |
          nohup pnpm exec next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/login > /dev/null && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_NO_SERVER: "1"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter @stay-ops/web test:e2e --grep "@smoke|@a11y" --grep-invert "@calendar"
          else
            pnpm --filter @stay-ops/web test:e2e
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/web/next.log

  lighthouse:
    name: lighthouse budget
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stayops
          POSTGRES_PASSWORD: stayops
          POSTGRES_DB: stayops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayops -d stayops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
          --health-start-period 10s

    env:
      DATABASE_URL: postgresql://stayops:stayops@localhost:5432/stayops
      SESSION_SECRET: ci-lighthouse-session-secret-at-least-32-chars-long
      SESSION_COOKIE_SECURE: "false"
      APP_TIMEZONE: Etc/UTC
      SKIP_STAYOPS_ENV_VALIDATE: "1"
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@stay-ops/web^...

      - name: Migrate database
        run: pnpm --filter @stay-ops/db exec prisma migrate deploy

      - name: Build the app
        run: pnpm --filter @stay-ops/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @stay-ops/web exec playwright install chromium --with-deps

      - name: Start the production server
        working-directory: apps/web
        run: |
          nohup pnpm exec next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/login > /dev/null && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Lighthouse on /app/calendar (performance >= 90, accessibility >= 95)
        run: pnpm --filter @stay-ops/web e2e:lighthouse --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_NO_SERVER: "1"
